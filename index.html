<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flex City India — Official Community Tier List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    .neon-border { border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }
    .card-bg { background: linear-gradient(145deg, #131824, #0f131d); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-[#0d111a]/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-lg">FC</div>
        <div>
          <h1 class="font-bold text-lg tracking-wide text-white">FLEX CITY <span class="text-cyan-400">TIERS</span></h1>
          <p class="text-[11px] text-slate-400 -mt-1">1v1 Competitive Ranking</p>
        </div>
      </div>

      <div id="authArea" class="flex items-center gap-3">
        <button id="loginBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-1.5 rounded-lg text-sm transition">
          Login with Google
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl w-full mx-auto px-4 py-6 flex-1">

    <!-- Region Tabs + Action Buttons -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button class="px-4 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-semibold text-sm flex items-center gap-2">
          🇮🇳 India
        </button>
        <button disabled class="px-4 py-1.5 rounded-lg text-slate-500 text-sm cursor-not-allowed">
          🌍 Global (Soon)
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="openSubmitBtn" class="hidden bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
          + Submit 1v1 Proof
        </button>
        <button id="openAdminBtn" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
          🛡️ Admin Panel (<span id="pendingCount">0</span>)
        </button>
      </div>
    </div>

    <!-- Category Filter -->
    <div class="flex gap-2 mb-4">
      <button onclick="setSort('total')" id="sort-total" class="sort-btn px-3 py-1 rounded-md text-xs font-semibold bg-cyan-500 text-slate-950">Overall Rank</button>
      <button onclick="setSort('long')" id="sort-long" class="sort-btn px-3 py-1 rounded-md text-xs font-semibold bg-slate-800 text-slate-300">Long Range Top</button>
      <button onclick="setSort('short')" id="sort-short" class="sort-btn px-3 py-1 rounded-md text-xs font-semibold bg-slate-800 text-slate-300">Short Range Top</button>
    </div>

    <!-- Leaderboard Table -->
    <div class="card-bg rounded-2xl neon-border overflow-hidden">
      <div class="grid grid-cols-12 px-4 py-3 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase">
        <div class="col-span-2">Rank</div>
        <div class="col-span-5">Player (Click for Details)</div>
        <div class="col-span-2 text-center">Long</div>
        <div class="col-span-2 text-center">Short</div>
        <div class="col-span-1 text-right">Pts</div>
      </div>
      <div id="leaderboardList" class="divide-y divide-slate-800/70">
        <div class="p-8 text-center text-slate-400 text-sm">Loading India Leaderboard...</div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500 px-4">
    This is an unofficial fan-made community leaderboard and is not affiliated with Flex City or Jarvi Games.
  </footer>

  <!-- Player Profile Modal -->
  <div id="playerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="card-bg neon-border rounded-2xl max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('playerModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">&times;</button>
      <div class="flex items-center gap-3 mb-4">
        <img id="modalAvatar" src="" class="w-12 h-12 rounded-full border border-cyan-500/40" />
        <div>
          <h2 id="modalName" class="text-xl font-bold text-white">Player Name</h2>
          <p id="modalSub" class="text-xs text-slate-400">Total 1v1s: 0 • Total Points: 0</p>
        </div>
      </div>

      <!-- Long / Short Range Tabs -->
      <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl mb-4">
        <button id="tabLongBtn" onclick="switchPlayerTab('long')" class="py-2 rounded-lg text-sm font-semibold bg-cyan-500 text-slate-950">
          🎯 Long Range
        </button>
        <button id="tabShortBtn" onclick="switchPlayerTab('short')" class="py-2 rounded-lg text-
